<rect x="210" y="520" width="400" height="270" rx="20" fill="#FFFFFF" stroke="#DAD7CE" stroke-width="1.5"/>
<rect x="210" y="520" width="400" height="10" rx="5" fill="#2D4F9E"/>
<text x="238" y="586" font-size="40" font-weight="800" fill="#2D4F9E">04</text>
<text x="302" y="584" font-size="32" font-weight="800" fill="#1B1F24">Prove it works</text>
<rect x="238" y="612" width="91" height="42" rx="21.0" fill="#14181D"/><text x="256" y="641" font-size="22" font-weight="700" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7BD88F">/tdd</text>
<rect x="238" y="666" width="159" height="42" rx="21.0" fill="#DAD7CE"/><text x="256" y="695" font-size="22" font-weight="700" fill="#1B1F24">test suite</text>
