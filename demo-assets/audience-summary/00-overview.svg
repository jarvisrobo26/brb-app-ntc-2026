<text x="270" y="766" font-size="23" font-weight="700" fill="#7A2E8C">You approve the contract</text>
<line x1="616" y1="655.0" x2="640" y2="655.0" stroke="#5A6270" stroke-width="3" marker-end="url(#ah)"/>
<rect x="646" y="520" width="400" height="270" rx="20" fill="#FFFFFF" stroke="#DAD7CE" stroke-width="1.5"/>
<rect x="646" y="520" width="400" height="10" rx="5" fill="#2D4F9E"/>
<text x="674" y="586" font-size="40" font-weight="800" fill="#2D4F9E">05</text>
<text x="738" y="584" font-size="32" font-weight="800" fill="#1B1F24">Ship it safely</text>
<rect x="674" y="612" width="77" height="42" rx="21.0" fill="#14181D"/><text x="692" y="641" font-size="22" font-weight="700" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7BD88F">/pr</text>
<rect x="674" y="666" width="135" height="42" rx="21.0" fill="#DAD7CE"/><text x="692" y="695" font-size="22" font-weight="700" fill="#1B1F24">rollback</text>
<line x1="674" y1="724" x2="1018" y2="724" stroke="#DAD7CE"/>
<circle cx="686" cy="758" r="9" fill="#7A2E8C"/>
<text x="706" y="766" font-size="23" font-weight="700" fill="#7A2E8C">You press release</text>
<line x1="1052" y1="655.0" x2="1076" y2="655.0" stroke="#5A6270" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1082" y="520" width="400" height="270" rx="20" fill="#FFFFFF" stroke="#DAD7CE" stroke-width="1.5"/>
<rect x="1082" y="520" width="400" height="10" rx="5" fill="#2D4F9E"/>
<text x="1110" y="586" font-size="40" font-weight="800" fill="#2D4F9E">06</text>
<text x="1174" y="584" font-size="32" font-weight="800" fill="#1B1F24">Learn from it</text>
<rect x="1110" y="612" width="118" height="42" rx="21.0" fill="#14181D"/><text x="1128" y="641" font-size="22" font-weight="700" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7BD88F">/retro</text>
<rect x="1110" y="666" width="159" height="42" rx="21.0" fill="#14181D"/><text x="1128" y="695" font-size="22" font-weight="700" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7BD88F">AGENTS.md</text>
<line x1="1110" y1="724" x2="1454" y2="724" stroke="#DAD7CE"/>
<circle cx="1122" cy="758" r="9" fill="#7A2E8C"/>
<text x="1142" y="766" font-size="23" font-weight="700" fill="#7A2E8C">You approve the rule</text>
<path d="M1282.0,474 v20 H410.0 v20" fill="none" stroke="#5A6270" stroke-width="3" marker-end="url(#ah)"/>
<path d="M1282.0,794 v22 H188 V335.0 h16" fill="none" stroke="#7A2E8C" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ah)"/>
<text x="1268.0" y="810" text-anchor="end" font-size="17" font-weight="700" fill="#7A2E8C">next run</text>
<text x="64" y="872" font-size="24" fill="#5A6270"><tspan font-weight="800" fill="#7A2E8C">The loop closes:</tspan> every failure in 06 becomes a rule the next 01 reads first.</text>
